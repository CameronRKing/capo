services:
  # Frontend service (Vite + React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: capo-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.vite
      - ./logs/frontend:/app/logs
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_CONVEX_URL=http://host.docker.internal:3210
    stdin_open: true
    tty: true
    networks:
      - capo-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
        tag: "{{.Name}}/{{.ID}}"

networks:
  capo-network:
    driver: bridge

volumes:
  convex-data:
    driver: local
